# Milestone 1 template. All paths resolve against the Snakemake working directory.
# Fill these external paths before running. No data download is performed.
schema_version: 1
samples: null
output_dir: null
reference:
  mode: generated
  ncrna_fasta: null
  viral_fastas: []
  prefix_length: 30
  drop_biotypes: []  # Set per experiment; description pseudogenes always dropped.
preprocessing:
  adapter: null
  quality: null
  minimum_length: null
  nextseq_trim: null
mapping:
  norc: true
  preset: very-sensitive
  seed: 0
  threads: 4
counting:
  mapq: 20
  strand: both
  exclude_duplicates: false
  min_total_count: 0  # 0: raw only; >0: also emit a thresholded matrix
